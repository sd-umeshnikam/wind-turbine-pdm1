# Docker Compose variant of wtb-pdm.conf (that one's for the native Linux/systemd
# install from docs/LINUX_HOSTING_GUIDE.md - same routing, different proxy target
# since gateway is a separate container here, not 127.0.0.1). Static files are
# baked into the image by Dockerfile's build stage, not bind-mounted.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) - any unmatched path falls back to
    # index.html so deep links (e.g. /twin/A-1) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must be revalidated so a new deploy's hashed bundles load; without
        # this, browsers kept serving the previous build's page.
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed file names, so these can be cached for good. Matched by
    # file extension, not just the /assets/ prefix: the app's own /assets/:turbineId
    # route shares that prefix and must still fall through to index.html.
    location ~* ^/assets/.+\.(js|css|svg|png|jpe?g|gif|woff2?|ttf|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /graphql {
        proxy_pass http://gateway:4000/graphql;
        proxy_http_version 1.1;
        # WebSocket upgrade headers - graphql-ws subscriptions use the same path.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/chat {
        # Resolve per request via Docker's DNS: a recreated chatbot container gets a new
        # IP, and a startup-time lookup would keep pointing at the old one (502s).
        resolver 127.0.0.11 valid=10s;
        set $chatbot_upstream http://chatbot:8090;
        proxy_pass $chatbot_upstream;
        proxy_set_header Host $host;
        # Used by the chatbot's per-client rate limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /health {
        proxy_pass http://gateway:4000/health;
    }
}

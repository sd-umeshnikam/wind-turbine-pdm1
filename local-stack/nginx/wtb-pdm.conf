# Serves the built React dashboard as static files and reverse-proxies /graphql
# (HTTP + WebSocket, same path per local-stack/gateway/src/server.ts) to the local
# gateway - one origin, no CORS to worry about, no CloudFront/S3 substitute needed
# for a single-box setup.
#
# Install: sudo cp wtb-pdm.conf /etc/nginx/sites-available/wtb-pdm
#          sudo ln -s /etc/nginx/sites-available/wtb-pdm /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Adjust `root` below to wherever you cloned the repo.

server {
    listen 80;
    server_name _;

    root /opt/wtb-pdm/frontend/dashboard-app/dist;
    index index.html;

    # React Router (client-side routing) - any unmatched path falls back to
    # index.html so deep links (e.g. /twin/A-1) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /graphql {
        proxy_pass http://127.0.0.1:4000/graphql;
        proxy_http_version 1.1;
        # WebSocket upgrade headers - graphql-ws subscriptions use the same path.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
    }
}

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wtpdm"
version = "2.0.0"
description = "Wind turbine predictive-maintenance platform: ingest, ML, scoring, API and assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "pyyaml==6.0.2",
  "structlog==24.4.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "polars==1.12.0",
  "pyarrow==17.0.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "lightgbm==4.5.0",
  "lifelines==0.29.0",
  "shap==0.46.0",
  "mlflow==2.17.2",
  "matplotlib==3.9.2",
  "tabulate==0.9.0",
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "sse-starlette==2.1.3",
  "python-multipart==0.0.17",
  "pyjwt==2.9.0",
  "bcrypt==4.2.0",
  "httpx==0.27.2",
  "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==6.0.0", "ruff==0.7.2", "mypy==1.13.0", "types-PyYAML==6.0.12.20240917"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wtpdm*"]

[tool.setuptools.package-data]
wtpdm = ["config/*.yaml", "db/migrations/*.py", "db/migrations/versions/*.py", "db/alembic.ini"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency and parameter declarations are evaluated once, by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated column definitions.
"wtpdm/db/migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the compose database (skipped when WTPDM_DATABASE_URL is unreachable)"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

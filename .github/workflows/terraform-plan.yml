name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write # required for AWS OIDC
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            env_upper: DEV
          - env: staging
            env_upper: STAGING
          - env: uat
            env_upper: UAT
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    env:
      TF_VAR_databricks_host: ${{ secrets[format('DATABRICKS_HOST_{0}', matrix.env_upper)] }}
      TF_VAR_databricks_external_id: ${{ secrets[format('DATABRICKS_EXTERNAL_ID_{0}', matrix.env_upper)] }}
      TF_VAR_vpc_id: ${{ secrets[format('VPC_ID_{0}', matrix.env_upper)] }}
      TF_VAR_private_subnet_ids: ${{ secrets[format('PRIVATE_SUBNET_IDS_{0}', matrix.env_upper)] }} # JSON list, e.g. ["subnet-a","subnet-b"]
      DATABRICKS_TOKEN: ${{ secrets[format('DATABRICKS_TOKEN_{0}', matrix.env_upper)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: create these per-environment IAM roles + GitHub OIDC trust and
          # set one secret per env, e.g. AWS_ROLE_ARN_DEV / _STAGING / _UAT.
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.env_upper)] }}
          aws-region: us-east-1

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ../../

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan.binary

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: infra/terraform/envs/${{ matrix.env }}/tfplan.binary
          retention-days: 5

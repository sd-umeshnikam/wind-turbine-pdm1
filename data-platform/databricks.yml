bundle:
  name: wtb-data-platform

include:
  - resources/jobs.yml

variables:
  bronze_bucket_prefix:
    description: "S3 bucket name prefix for the bronze landing zone (bucket is <env>-wtb-bronze)"
    default: "wtb-bronze"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dev-wtb.cloud.databricks.com # placeholder, replace with the real dev workspace URL
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  staging:
    mode: production
    workspace:
      host: https://staging-wtb.cloud.databricks.com # placeholder, replace with the real staging workspace URL
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: svc-wtb-databricks-staging # placeholder service principal

  uat:
    mode: production
    workspace:
      host: https://uat-wtb.cloud.databricks.com # placeholder, replace with the real uat workspace URL
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: svc-wtb-databricks-uat # placeholder service principal

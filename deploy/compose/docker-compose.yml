# Wind Turbine PdM Platform v2. Services are added phase by phase; ports are chosen
# so v2 can run alongside the legacy local-stack (80/4000/5000/5433/8080/8090).
name: wtpdm

x-platform: &platform
  image: wtpdm/platform:dev
  build:
    context: ../../platform
  env_file:
    - path: .env
      required: false
  environment:
    WTPDM_DATABASE_URL: postgresql+psycopg://wtpdm:${WTPDM_DB_PASSWORD:-wtpdm}@db:5432/wtpdm
    WTPDM_MLFLOW_TRACKING_URI: http://mlflow:5000
    WTPDM_RAW_DATA_ROOT: /data/raw
    WTPDM_LAKE_ROOT: /data/lake
    WTPDM_REPLAY_SPEED: ${WTPDM_REPLAY_SPEED:-60}
    WTPDM_MLFLOW_UI_URL: ${WTPDM_MLFLOW_UI_URL:-http://localhost:5001}
  volumes:
    - ${WTPDM_RAW_DATA_DIR:-D:/wind-turbine-scada-data-for-early-fault-detection}:/data/raw:ro
    - lake:/data/lake
    - mlartifacts:/mlartifacts

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wtpdm
      POSTGRES_PASSWORD: ${WTPDM_DB_PASSWORD:-wtpdm}
      POSTGRES_DB: wtpdm
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200"]
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"  # host-only: never expose the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtpdm -d wtpdm"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    restart: unless-stopped
    # Tracking + registry metadata in a file store on the `mlruns` volume, artifacts on the
    # `mlartifacts` volume served through the tracking server (clients never need the path).
    # Exec form: every flag reaches the server (a folded shell string once dropped them).
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=file:///mlruns
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
    volumes:
      - mlruns:/mlruns
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:5001:5000"  # host-only: MLflow has no authentication
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    <<: *platform
    command: ["alembic", "-c", "wtpdm/db/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *platform
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"  # host-only: clients go through `web`, which proxies /api
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Replay of real SCADA history -> online scoring -> alerts; drift checks; retrain schedule.
  worker:
    <<: *platform
    command: ["python", "-m", "wtpdm.realtime.worker"]
    environment:
      WTPDM_DATABASE_URL: postgresql+psycopg://wtpdm:${WTPDM_DB_PASSWORD:-wtpdm}@db:5432/wtpdm
      WTPDM_MLFLOW_TRACKING_URI: http://mlflow:5000
      WTPDM_RAW_DATA_ROOT: /data/raw
      WTPDM_LAKE_ROOT: /data/lake
      WTPDM_REPLAY_SPEED: ${WTPDM_REPLAY_SPEED:-60}
      WTPDM_DRIFT_INTERVAL_MINUTES: ${WTPDM_DRIFT_INTERVAL_MINUTES:-15}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/wtpdm-worker.heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 120s

  # Executes queued retrain jobs (schedule, drift, manual) one at a time.
  retrainer:
    <<: *platform
    command: ["python", "-m", "wtpdm.mlops.retrain", "run"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

  # Enterprise console (React, served by nginx, /api proxied same-origin).
  web:
    image: wtpdm/console:dev
    build:
      context: ../../frontend/console
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WTPDM_WEB_PORT:-3000}:8080"

  # Optional public link (opt-in: `docker compose --profile public up -d tunnel`). A
  # Cloudflare quick tunnel to the console; the URL appears in `docker compose logs tunnel`.
  # Only `web` is published: the API is reached through it, MLflow and the database never.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8080"]

volumes:
  dbdata:
  mlruns:
  lake:
  mlartifacts:
